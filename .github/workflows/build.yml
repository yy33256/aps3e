name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Cache NDK and CMake
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.CMAKE_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-cmake-${{ env.CMAKE_VERSION }}

      - name: Install NDK and CMake
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/signing.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using signing key from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found, generating a debug key"
            keytool -genkeypair -v -keystore "$KS" -storetype JKS \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KS_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASS=android" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$KS" >> "$GITHUB_ENV"

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          APK_IN=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK_IN" ]; then echo "No APK produced"; exit 1; fi
          echo "Input APK: $APK_IN"
          mkdir -p dist
          OUT="dist/aps3e-arm64-v8a-release-${GITHUB_SHA::7}.apk"
          "$BT/zipalign" -f -p 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS_FILE" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$KS_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aps3e-arm64-v8a-release
          path: dist/*.apk
          if-no-files-found: error
